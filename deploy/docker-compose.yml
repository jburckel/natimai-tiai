# Stack serveur Tiai — db + backend + worker + frontend + caddy.
# Les agents Windows ne sont PAS dans Docker (ils tournent sur les postes).
#
# Démarrage : cp .env.example .env && docker compose up -d
# TLS terminé par Caddy (certificat de l'AC interne, cf. deploy/certs/).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Compte d'administration (superutilisateur) : initialisation, sauvegardes.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Rôle applicatif, créé par db/app-role.sh (cf. DEPLOYMENT.md).
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-tiai_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Lancé par l'image à la première initialisation du volume ; à lancer à
      # la main une fois sur une base existante (DEPLOYMENT.md).
      - ./db/app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sauvegarde quotidienne de la base dans ./backups (cf. DEPLOYMENT.md
  # § « Sauvegardes et restauration »). Même image que `db` pour garantir un
  # pg_dump de la même version que le serveur.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Pour la restauration : les objets restaurés reviennent au rôle applicatif.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-tiai_app}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      # Le rôle applicatif, jamais le superutilisateur : le backend refuse de
      # démarrer hors ENVIRONMENT=local s'il se retrouve superutilisateur.
      POSTGRES_USER: ${POSTGRES_APP_USER:-tiai_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD manquant, cf. DEPLOYMENT.md « Rôle applicatif PostgreSQL »}
    command: ["api"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      # Le rôle applicatif, jamais le superutilisateur : le backend refuse de
      # démarrer hors ENVIRONMENT=local s'il se retrouve superutilisateur.
      POSTGRES_USER: ${POSTGRES_APP_USER:-tiai_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD manquant, cf. DEPLOYMENT.md « Rôle applicatif PostgreSQL »}
    command: ["worker"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Seule variable dont le Caddyfile a besoin — pas d'`env_file: .env` ici,
    # qui exposerait inutilement les secrets du backend au conteneur Caddy.
    environment:
      TIAI_SERVER_NAME: ${TIAI_SERVER_NAME:-tiai.natimai.local}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  caddy_data:
  caddy_config:
